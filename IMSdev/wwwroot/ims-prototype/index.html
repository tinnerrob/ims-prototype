<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMS — Industrial Rental Suite</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><i class="bi bi-layers-half"></i></div>
      <div class="brand-text">
        <span class="brand-name">IMS</span>
        <span class="brand-sub">Industrial Rental Suite</span>
      </div>
    </div>
    <nav class="side-nav">
      <div class="nav-section">Operations</div>
      <button class="nav-item active" data-view="dashboard"><i class="bi bi-speedometer2"></i><span>Dashboard</span></button>
      <button class="nav-item" data-view="logistics"><i class="bi bi-truck"></i><span>Logistics Board</span></button>
      <button class="nav-item" data-view="scheduler"><i class="bi bi-calendar3"></i><span>Scheduler</span></button>
      <button class="nav-item" data-view="geo"><i class="bi bi-geo-alt"></i><span>Geo Asset Tracking</span><span class="nav-badge badge-alert" id="navGeoBadge" title="Open geofence alerts">0</span></button>
      <button class="nav-item" data-view="contracts"><i class="bi bi-folder2-open"></i><span>Customers &amp; Contracts</span></button>
      <button class="nav-item" data-view="inventory"><i class="bi bi-box-seam"></i><span>Inventory &amp; Assets</span></button>
      <div class="nav-section">Yard &amp; Shop</div>
      <button class="nav-item" data-view="timesheet"><i class="bi bi-clock-history"></i><span>Labor &amp; Timesheets</span></button>
      <button class="nav-item" data-view="yard"><i class="bi bi-clipboard-check"></i><span>Yard Inspections</span></button>
      <button class="nav-item" data-view="maintenance"><i class="bi bi-tools"></i><span>Service &amp; Maintenance</span></button>
      <div class="nav-section">Finance &amp; Admin</div>
      <button class="nav-item" data-view="invoicing"><i class="bi bi-receipt"></i><span>Cycle Invoicing</span></button>
      <button class="nav-item" data-view="rerents"><i class="bi bi-arrow-left-right"></i><span>Sub-Rentals</span></button>
      <div class="nav-section">Administration</div>
      <button class="nav-item" data-view="branches"><i class="bi bi-buildings"></i><span>Branch / Yard Profiles</span></button>
      <button class="nav-item" data-view="pricing"><i class="bi bi-sliders"></i><span>Pricing Rules</span></button>
      <button class="nav-item" data-view="categories"><i class="bi bi-tags"></i><span>Resource Categories</span></button>
    </nav>
    <div class="sidebar-footer">
      <div class="sim-status"><span class="pulse-dot"></span> GPS Link LIVE</div>
      <div class="user-chip">
        <div class="avatar">DR</div>
        <div class="user-meta">
          <span class="user-name">D. Reynolds</span>
          <span class="user-role">Dispatch Manager</span>
        </div>
        <i class="bi bi-three-dots"></i>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn btn-link d-lg-none" id="menuToggle"><i class="bi bi-list"></i></button>
        <div class="topbar-titles">
          <h1 id="pageTitle">Dashboard</h1>
          <div class="topbar-sub" id="pageSub">Aggregated business metrics from all mocked data engines.</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="global-search">
          <i class="bi bi-search"></i>
          <input id="globalSearch" type="text" placeholder="Search assets, SKUs, contracts, employees...">
        </div>
        <button class="icon-btn" id="notifBtn" title="Notifications"><i class="bi bi-bell"></i><span class="notif-count" id="notifCount">0</span></button>
        <span class="topbar-date" id="topbarDate"></span>
      </div>
    </header>
    <div class="content" id="content">
      <!-- Views are rendered into this container by js/app.js -->
    </div>
  </main>
</div>

<!-- Modals are appended to <body> by js/app.js -->

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/inventory.js"></script>
<script src="js/pages/scheduler.js"></script>
<script src="js/pages/contracts.js"></script>
<script src="js/pages/geo.js"></script>
<script src="js/pages/maintenance.js"></script>
<script src="js/pages/timesheet.js"></script>
<script src="js/pages/yard.js"></script>
<script src="js/pages/logistics.js"></script>
<script src="js/pages/invoicing.js"></script>
<script src="js/pages/rerents.js"></script>
<script src="js/pages/branches.js"></script>
<script src="js/pages/pricing.js"></script>
<script src="js/pages/categories.js"></script>
<script src="js/router.js"></script>
</body>
</html>
